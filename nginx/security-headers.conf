# Included by every location that sets headers of its own: nginx inherits add_header from the
# level above only when the level below has none, so a location with `Cache-Control` would
# silently drop the server-wide ones.
#
# Not set here on purpose:
#  - Strict-Transport-Security: this container speaks plain http; TLS ends at the proxy in front
#    of it, and that is where HSTS belongs.
#  - A full Content-Security-Policy: it has to name the API origin (a build argument, not known to
#    this file) and Google's sign-in scripts/frames; a wrong one fails silently as a broken
#    login button. Only the directives that cannot break anything are set.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
