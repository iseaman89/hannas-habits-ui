server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Vite fingerprints everything in /assets (content hash in the file name): cache it for good.
    # `^~`: without it the regex location for files with an extension (below) wins over this prefix,
    # and the hashed files got the one hour of the "other files" rule.
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html names the current hashed files, so it must always be revalidated.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # For the container's HEALTHCHECK and for whatever orchestrates it.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # A file that is not there (a favicon, a script of an old deploy) is a 404, not the app: HTML
    # in answer to a script request only produces "Unexpected token <" and hides the real cause.
    # No route of the app has a dot, so this cannot catch a deep link.
    location ~ \.[A-Za-z0-9]+$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # SPA fallback: a deep link or a reload on /diary/2026-10-08 must serve the app,
    # the router decides what to show. (The fallback is an internal redirect to /index.html,
    # so it is answered by the location above and gets its headers there.)
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
