server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/ttf;

    # Vite fingerprints everything in /assets (content hash in the file name): cache it for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html names the current hashed files, so it must always be revalidated.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: a deep link or a reload on /diary/2026-10-08 must serve the app,
    # the router decides what to show.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
